services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tickframe}
      POSTGRES_USER: ${POSTGRES_USER:-tickframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGPORT: ${POSTGRES_PORT:-5432}
    command: ["postgres", "-p", "${POSTGRES_PORT:-5432}"]
    volumes:
      - tickframe-timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tickframe} -d ${POSTGRES_DB:-tickframe} -p ${POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tickframe}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-timescaledb}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-tickframe}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-4173}
      TICKFRAME_AUTH_SESSION_DAYS: ${TICKFRAME_AUTH_SESSION_DAYS:-7}
      TICKFRAME_CORS_ORIGINS: ${TICKFRAME_CORS_ORIGINS:-}
      TICKFRAME_DISABLE_COLLECTORS: ${TICKFRAME_DISABLE_COLLECTORS:-0}
      TICKFRAME_MARKETS_CONFIG_PATH: ${TICKFRAME_MARKETS_CONFIG_PATH:-/app/backend/config/markets.runtime.yaml}
      TICKFRAME_ENABLED_INSTRUMENTS: ${TICKFRAME_ENABLED_INSTRUMENTS:-all}
      TICKFRAME_ALLOWED_LATENESS_MS: ${TICKFRAME_ALLOWED_LATENESS_MS:-2000}
      TICKFRAME_RAW_TRADE_RETENTION_HOURS: ${TICKFRAME_RAW_TRADE_RETENTION_HOURS:-72}
      TICKFRAME_BINANCE_REST_URLS: ${TICKFRAME_BINANCE_REST_URLS:-}
      TICKFRAME_BINANCE_WS_URLS: ${TICKFRAME_BINANCE_WS_URLS:-}
      TICKFRAME_BYBIT_REST_URLS: ${TICKFRAME_BYBIT_REST_URLS:-}
      TICKFRAME_BYBIT_WS_URLS: ${TICKFRAME_BYBIT_WS_URLS:-}
      TICKFRAME_DISABLE_RECOVERY_BACKFILL: ${TICKFRAME_DISABLE_RECOVERY_BACKFILL:-0}
      TICKFRAME_RECOVERY_BACKFILL_HOURS: ${TICKFRAME_RECOVERY_BACKFILL_HOURS:-72}
      TICKFRAME_BINANCE_1S_BACKFILL_HOURS: ${TICKFRAME_BINANCE_1S_BACKFILL_HOURS:-24}
      TICKFRAME_SECOND_REPAIR_HOURS: ${TICKFRAME_SECOND_REPAIR_HOURS:-72}
      TICKFRAME_STABLE_CHART_DELAY_MS: ${TICKFRAME_STABLE_CHART_DELAY_MS:-2000}
      TICKFRAME_PATTERN_CONFIDENCE_THRESHOLD: ${TICKFRAME_PATTERN_CONFIDENCE_THRESHOLD:-0.45}
      TICKFRAME_PATTERN_MODEL_PATH: ${TICKFRAME_PATTERN_MODEL_PATH:-}
      TICKFRAME_SHUTDOWN_TIMEOUT: ${TICKFRAME_SHUTDOWN_TIMEOUT:-15s}
      TICKFRAME_SCRIPT_RUNNER_EMAILS: ${TICKFRAME_SCRIPT_RUNNER_EMAILS:-}
      TICKFRAME_SCRIPT_MAX_ACTIVE_RUNS: ${TICKFRAME_SCRIPT_MAX_ACTIVE_RUNS:-10}
      TICKFRAME_SCRIPT_MAX_STORED_RUNS: ${TICKFRAME_SCRIPT_MAX_STORED_RUNS:-100}
      TICKFRAME_SCRIPT_MAX_OUTPUT_KB: ${TICKFRAME_SCRIPT_MAX_OUTPUT_KB:-64}
      TICKFRAME_SCRIPT_DEFAULT_TIMEOUT_SECONDS: ${TICKFRAME_SCRIPT_DEFAULT_TIMEOUT_SECONDS:-1800}
      TICKFRAME_SCRIPT_ML_TIMEOUT_SECONDS: ${TICKFRAME_SCRIPT_ML_TIMEOUT_SECONDS:-7200}
      TICKFRAME_SCRIPT_QUALITY_TIMEOUT_SECONDS: ${TICKFRAME_SCRIPT_QUALITY_TIMEOUT_SECONDS:-600}
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - tickframe-ml-data:/app/data
      - ${TICKFRAME_MARKETS_CONFIG_FILE:-./backend/config/markets.yaml}:${TICKFRAME_MARKETS_CONFIG_PATH:-/app/backend/config/markets.runtime.yaml}:ro
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['BACKEND_PORT'] + '/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-4173}
      NGINX_ENVSUBST_FILTER: BACKEND_PORT|FRONTEND_PORT
    ports:
      - "${FRONTEND_PORT:-4173}:${FRONTEND_PORT:-4173}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${FRONTEND_PORT}/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
      PROMETHEUS_SCRAPE_INTERVAL: ${PROMETHEUS_SCRAPE_INTERVAL:-5s}
      PROMETHEUS_EVALUATION_INTERVAL: ${PROMETHEUS_EVALUATION_INTERVAL:-5s}
      PROMETHEUS_RETENTION_TIME: ${PROMETHEUS_RETENTION_TIME:-15d}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s/BACKEND_PORT_PLACEHOLDER/$${BACKEND_PORT}/g"
        -e "s/PROMETHEUS_SCRAPE_INTERVAL_PLACEHOLDER/$${PROMETHEUS_SCRAPE_INTERVAL}/g"
        -e "s/PROMETHEUS_EVALUATION_INTERVAL_PLACEHOLDER/$${PROMETHEUS_EVALUATION_INTERVAL}/g"
        /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        && exec /bin/prometheus
        --config.file=/tmp/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=$${PROMETHEUS_RETENTION_TIME}
        --web.console.libraries=/usr/share/prometheus/console_libraries
        --web.console.templates=/usr/share/prometheus/consoles
        --web.listen-address=:$${PROMETHEUS_PORT}
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - tickframe-prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PROMETHEUS_PORT:-9090}:${PROMETHEUS_PORT:-9090}"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_ANONYMOUS_ROLE:-Viewer}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
      GF_USERS_DEFAULT_THEME: ${GRAFANA_DEFAULT_THEME:-light}
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - tickframe-grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "${GRAFANA_PORT:-3000}:${GRAFANA_PORT:-3000}"
    restart: unless-stopped

volumes:
  tickframe-timescale-data:
  tickframe-prometheus-data:
  tickframe-grafana-data:
  tickframe-ml-data:

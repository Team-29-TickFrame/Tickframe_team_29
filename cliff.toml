# git-cliff configuration for Tickframe release notes.
# Run: git-cliff --config cliff.toml --output CHANGELOG.generated.md

[changelog]
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
protect_breaking_commits = true
split_commits = false
sort_commits = "oldest"
topo_order = false
topo_order_commits = true

commit_preprocessors = [
    { pattern = "(?s)\\n.*", replace = "" },
]

commit_parsers = [
    { message = "^Merge pull request", skip = true },
    { message = "^Merge branch", skip = true },
    { message = "^Merge remote-tracking branch", skip = true },
    { message = "^feat|^add |^Add |^Create |^Implement |^display |^A5-.*add |^A5-.*Prepare |^A5-.*Report |^real dataset", group = "<!-- 0 -->Added" },
    { message = "^fix|^Restore|^Rename|^record |^debugging", group = "<!-- 2 -->Fixed" },
    { message = "^docs|^Update|^Finalize|^refresh|^align|^document|^prepare|^link|^small changes|^latest|^last|^testing", group = "<!-- 1 -->Changed" },
    { message = "^test|^tests", group = "<!-- 3 -->Testing" },
    { message = "^ci", group = "<!-- 4 -->Build" },
    { message = ".*", group = "<!-- 5 -->Other" },
]
